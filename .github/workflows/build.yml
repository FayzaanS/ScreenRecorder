name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Show versions
        run: sw_vers && xcrun swiftc --version

      - name: Build the app
        run: ./build.sh --no-install

      - name: Record a short test clip
        run: |
          xcrun swiftc -O -swift-version 5 -parse-as-library -target "$(uname -m)-apple-macos13.0" \
            Sources/Recorder.swift Tests/SmokeTest.swift -o build/smoke-test
          # Play some sounds while recording so there is system audio to capture.
          (sleep 2; for _ in 1 2 3; do afplay /System/Library/Sounds/Ping.aiff; done) &
          build/smoke-test build/smoke-test.mp4

      - name: Click through the real app (temporary check)
        run: |
          set -x
          icon='menu bar item 1 of menu bar 1'
          ax() { osascript -e "tell application \"System Events\" to tell process \"ScreenRecorder\" to $1"; }
          cat > build/check.swift <<'EOF'
          import AVFoundation
          let asset = AVURLAsset(url: URL(fileURLWithPath: CommandLine.arguments[1]))
          let duration = try await asset.load(.duration).seconds
          let video = try await asset.loadTracks(withMediaType: .video)
          let audio = try await asset.loadTracks(withMediaType: .audio)
          print("duration \(duration) s, video tracks: \(video.count), audio tracks: \(audio.count)")
          EOF

          "build/Screen Recorder.app/Contents/MacOS/ScreenRecorder" &
          sleep 3
          ax "get {description, title, help, size} of $icon"

          # Open the menu (clicking a status item blocks until its menu closes, hence the dance).
          osascript -e 'ignoring application responses' -e "tell application \"System Events\" to tell process \"ScreenRecorder\" to click $icon" -e 'end ignoring'
          sleep 1
          killall "System Events" || true
          sleep 1
          ax "get name of every menu item of menu 1 of $icon"
          ax "click menu item \"Start Recording\" of menu 1 of $icon"
          (sleep 1; afplay /System/Library/Sounds/Glass.aiff; afplay /System/Library/Sounds/Hero.aiff) &
          sleep 5
          ax "get {description, title, help} of $icon"

          # Click the red stop icon.
          ax "click $icon"
          sleep 3
          ax "get {description, title, help} of $icon"
          ls -la ~/Movies/"Screen Recordings"
          for f in ~/Movies/"Screen Recordings"/*.mp4; do xcrun swift build/check.swift "$f"; done
          osascript -e 'tell application "System Events" to get name of every window of process "Finder"'

          # Opening the app again should pop its menu open.
          open "build/Screen Recorder.app"
          sleep 2
          pgrep -fl ScreenRecorder || true
          ax "get name of every menu item of menu 1 of $icon"
          ax "click menu item \"Quit Screen Recorder\" of menu 1 of $icon"
          sleep 2
          if pgrep -f "MacOS/ScreenRecorder"; then echo "app still running"; exit 1; else echo "app quit"; fi
