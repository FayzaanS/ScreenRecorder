name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Show versions
        run: sw_vers && xcrun swiftc --version

      - name: Build the app
        run: ./build.sh --no-install

      - name: Record a short test clip
        run: |
          xcrun swiftc -O -swift-version 5 -parse-as-library -target "$(uname -m)-apple-macos13.0" \
            Sources/Recorder.swift Tests/SmokeTest.swift -o build/smoke-test
          # Play some sounds while recording so there is system audio to capture.
          (sleep 2; for _ in 1 2 3; do afplay /System/Library/Sounds/Ping.aiff; done) &
          build/smoke-test build/smoke-test.mp4
